<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book &amp; Enquire</title>
  <style>
    :root { --accent: #b5476b; --bg: #fbf6f4; --text: #2b2024; --muted: #7a6a70; --card: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 520px; margin: 40px auto; padding: 0 16px; }
    .card { background: var(--card); border-radius: 16px; padding: 28px; box-shadow: 0 6px 24px rgba(0,0,0,.06); }
    h1 { margin: 0 0 6px; font-size: 1.6rem; }
    p.lead { margin: 0 0 22px; color: var(--muted); }
    label { display: block; font-weight: 600; margin: 14px 0 6px; font-size: .95rem; }
    input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font: inherit; }
    input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
    textarea { min-height: 110px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }
    button { margin-top: 20px; width: 100%; padding: 14px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .thanks { text-align: center; }
    .thanks h2 { color: var(--accent); }
    .error { color: #b00020; margin-top: 12px; }
  </style>
</head>
<body>
<main>
  <div class="card" id="formCard">
    <h1>Welcome to our salon! 💇‍♀️</h1>
    <p class="lead">We're happy you're here. Tell us a little about yourself and what you're looking for, and we'll be in touch.</p>
    <form id="inquiryForm" novalidate>
      <div class="row">
        <div>
          <label for="firstName">Name</label>
          <input id="firstName" name="firstName" autocomplete="given-name" required>
        </div>
        <div>
          <label for="surname">Surname</label>
          <input id="surname" name="surname" autocomplete="family-name" required>
        </div>
      </div>
      <label for="cellphone">Cellphone number</label>
      <input id="cellphone" name="cellphone" type="tel" autocomplete="tel" required>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="inquiry">What can we help you with?</label>
      <textarea id="inquiry" name="inquiry" placeholder="e.g. I'd like to book braids for Saturday morning" required></textarea>
      <button type="submit" id="submitBtn">Send</button>
      <p class="error" id="error" hidden></p>
    </form>
  </div>

  <div class="card thanks" id="thanksCard" hidden>
    <h2>Thank you!</h2>
    <p id="thanksMsg"></p>
  </div>
</main>

<script>
  // Paste the webhook URL from your Make.com scenario here:
  const WEBHOOK_URL = "https://hook.eu1.make.com/REPLACE_WITH_YOUR_WEBHOOK_ID";

  const form = document.getElementById("inquiryForm");
  const btn = document.getElementById("submitBtn");
  const err = document.getElementById("error");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.hidden = true;
    if (!form.checkValidity()) {
      err.textContent = "Please fill in every field (and check your email address).";
      err.hidden = false;
      return;
    }
    const data = new URLSearchParams(new FormData(form));
    btn.disabled = true;
    btn.textContent = "Sending…";
    try {
      const res = await fetch(WEBHOOK_URL, { method: "POST", body: data });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      showThanks(text);
    } catch (ex) {
      err.textContent = "Sorry, something went wrong. Please try again or call us directly.";
      err.hidden = false;
      btn.disabled = false;
      btn.textContent = "Send";
    }
  });

  function showThanks(text) {
    const name = form.firstName.value.trim();
    document.getElementById("thanksMsg").textContent =
      text && text !== "Accepted" ? text
        : `Thank you, ${name}! We've received your message and will get back to you shortly.`;
    document.getElementById("formCard").hidden = true;
    document.getElementById("thanksCard").hidden = false;
  }
</script>
</body>
</html>
